<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="60%" stop-color="#07111e" />
      <stop offset="100%" stop-color="#03070d" />
    </radialGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="fuelFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f5a0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rectangle with liquid glow -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#glassBorder)" stroke-width="3" opacity="0.6" />

  <!-- Speedometer / Fuel Gauge Arc -->
  <path d="M 106 356 A 160 160 0 1 1 406 356" fill="none" stroke="#162c45" stroke-width="26" stroke-linecap="round" />
  <path d="M 106 356 A 160 160 0 1 1 360 165" fill="none" stroke="url(#fuelFill)" stroke-width="26" stroke-linecap="round" filter="url(#glow)" />

  <!-- Fuel Pump Center Graphic -->
  <g transform="translate(186, 175) scale(0.95)" filter="url(#glow)">
    <!-- Pump body -->
    <rect x="30" y="30" width="80" height="110" rx="14" fill="rgba(255,255,255,0.08)" stroke="#00f2fe" stroke-width="5" />
    <!-- Pump screen -->
    <rect x="44" y="44" width="52" height="32" rx="6" fill="#041220" stroke="#4facfe" stroke-width="2" />
    <path d="M 52 60 L 62 60 M 68 60 L 88 60" stroke="#00f5a0" stroke-width="3" stroke-linecap="round" />
    <!-- Fuel nozzle / hose -->
    <path d="M 110 50 C 135 50, 145 75, 145 105 L 145 130 C 145 142, 132 145, 132 135 L 132 105" fill="none" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" />
    <path d="M 132 105 L 122 90 L 115 95" fill="none" stroke="#00f5a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Base -->
    <rect x="22" y="140" width="96" height="10" rx="5" fill="#4facfe" />
  </g>

  <!-- Digital Speed / KMH Pill -->
  <rect x="166" y="375" width="180" height="44" rx="22" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="2" />
  <text x="256" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">HUD GPS</text>
</svg>
