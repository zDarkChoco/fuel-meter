<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gen-2 Dash</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --accent: #3498db; /* Blue */
            --warning: #f1c40f; /* Yellow */
            --danger: #e74c3c; /* Red */
            --success: #2ecc71; /* Green */
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent scrolling while driving */
        }

        /* --- TOP SECTION: SPEED & FUEL BAR --- */
        .dashboard-header {
            background: var(--card-bg);
            padding: 15px 20px;
            border-bottom: 2px solid #222;
            flex-shrink: 0;
        }

        .speed-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .speed-val {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums; /* Prevents jittering numbers */
        }
        .speed-lbl { font-size: 1rem; color: #888; letter-spacing: 2px; }

        /* The Fuel Bar (Restored) */
        .fuel-meta { display: flex; justify-content: space-between; font-size: 0.9rem; color: #aaa; margin-bottom: 5px;}
        .gauge-wrapper {
            background: #333;
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .gauge-bar {
            height: 100%;
            background: var(--accent);
            width: 50%;
            transition: width 0.5s ease, background-color 0.5s;
            box-shadow: 0 0 10px var(--accent);
        }

        /* --- MIDDLE SECTION: THE MAP --- */
        #map-container {
            flex-grow: 1; /* Takes up remaining space */
            position: relative;
            background: #222;
        }
        #map { height: 100%; width: 100%; z-index: 1; }
        /* Dark mode filter for map tiles so it doesn't blind you at night */
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

        /* --- BOTTOM SECTION: CONTROLS --- */
        .controls-container {
            background: var(--card-bg);
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 2px solid #222;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .main-btn {
            flex-grow: 2;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 1.1rem; font-weight: bold; text-transform: uppercase;
            background: #333; color: white;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.3s;
        }
        .main-btn.recording { background: var(--danger); box-shadow: 0 0 15px var(--danger); }

        .settings-btn {
            flex-grow: 1;
            background: #222; border: 1px solid #444; color: #aaa;
            font-size: 1.5rem;
        }

        /* --- HIDDEN MANUAL PANEL --- */
        .manual-panel {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: #1a1a1a;
            padding: 20px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            transform: translateY(110%); /* Hidden downwards by default */
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 20;
        }
        .manual-panel.active { transform: translateY(0); }

        /* Form styles */
        .tool-row { display: flex; gap: 10px; margin-bottom: 15px; }
        input.dark-input {
            background: #333; border: 1px solid #444; color: white; padding: 12px;
            border-radius: 8px; width: 100%; text-align: center; font-size: 1rem;
        }
        button.sm-btn {
            padding: 12px; border: none; border-radius: 8px;
            font-weight: bold; color: white; flex: 1;
        }
        .btn-blue { background: var(--accent); }
        .btn-green { background: var(--success); }
        .close-panel { text-align: center; margin-top: 10px; color: #777; cursor: pointer;}

    </style>
</head>
<body>

    <div class="dashboard-header">
        <div class="speed-container">
            <span class="speed-val" id="speedVal">0</span>
            <span class="speed-lbl">KM/H</span>
        </div>
        
        <div class="fuel-meta">
            <span id="dispLiters">25.0 L</span>
            <span id="dispRange">275 KM Est.</span>
        </div>
        <div class="gauge-wrapper">
            <div class="gauge-bar" id="gaugeBar"></div>
        </div>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <div class="controls-container">
        <button class="main-btn" id="gpsBtn" onclick="toggleDrive()">
            <span id="gpsIcon">📍</span> START DRIVE
        </button>
        <button class="main-btn settings-btn" onclick="toggleSettings()">
            ⚙️
        </button>
    </div>

    <div class="manual-panel" id="settingsPanel">
        <h4 style="margin-top:0; color:#aaa; text-align:center;">MANUAL ADJUSTMENTS</h4>
        
        <div class="tool-row">
            <input type="number" id="manualRM" class="dark-input" placeholder="RM Amount">
            <button class="sm-btn btn-green" onclick="manualRefill()">Add Fuel</button>
        </div>
         <div style="display:flex; justify-content:center; gap:20px; margin-bottom:20px;">
            <label style="color:#aaa;"><input type="radio" name="price" value="1.99" checked> Budi (1.99)</label>
            <label style="color:#aaa;"><input type="radio" name="price" value="2.60"> Std (2.60)</label>
        </div>

        <button onclick="fullTank()" style="width:100%; background:#444; color:#fff; padding:15px; border:none; border-radius:8px; font-weight:bold;">✅ Resync to FULL TANK</button>
        
        <div class="close-panel" onclick="toggleSettings()">Close Menu ⬇</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // --- CONFIG ---
        const TANK_CAPACITY = 50; 
        const EFFICIENCY = 11; 
        
        // --- STATE ---
        let fuelLiters = 25;
        let isTracking = false;
        let watchId = null;
        let wakeLock = null;
        // GPS vars
        let lastLat = null, lastLon = null;
        // Map vars
        let map, userMarker;

        // --- INIT ---
        window.onload = function() {
            loadData();
            initMap(); // Initialize the empty map
            updateUI();
        };

        // --- CORE UI & DATA ---
        function loadData() {
             const saved = localStorage.getItem('gen2_fuel_v3');
             if (saved) fuelLiters = parseFloat(saved);
        }

        function updateUI() {
            // 1. Clamp & Save
            if (fuelLiters < 0) fuelLiters = 0;
            if (fuelLiters > TANK_CAPACITY) fuelLiters = TANK_CAPACITY;
            localStorage.setItem('gen2_fuel_v3', fuelLiters.toFixed(4));

            // 2. Calculate visuals
            const pct = (fuelLiters / TANK_CAPACITY) * 100;
            const range = fuelLiters * EFFICIENCY;

            // 3. Update Text
            document.getElementById('dispLiters').innerText = fuelLiters.toFixed(1) + " L";
            document.getElementById('dispRange').innerText = "~" + range.toFixed(0) + " KM";

            // 4. Update Bar Gauge
            const bar = document.getElementById('gaugeBar');
            bar.style.width = pct + "%";

            // Dynamic Color & Glow
            let colorVar = "--accent";
            if(pct < 15) colorVar = "--danger";
            else if(pct < 30) colorVar = "--warning";
            else colorVar = "--accent";

            bar.style.backgroundColor = `var(${colorVar})`;
            bar.style.boxShadow = `0 0 10px var(${colorVar})`;
        }

        // --- MAP & GPS ---
        function initMap() {
            // Default view over Malaysia before GPS locks
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([4.2105, 101.9758], 6);
            
            // Add OpenStreetMap tiles (CartoDB Dark Matter style for aesthetics)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(map);

            // Create a custom marker icon for the car
            var carIcon = L.divIcon({
                className: 'car-marker',
                html: '<div style="width: 20px; height: 20px; background: #3498db; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px #3498db;"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            userMarker = L.marker([0,0], {icon: carIcon});
        }

        async function toggleDrive() {
            const btn = document.getElementById('gpsBtn');
            if (!isTracking) {
                // START
                if (!navigator.geolocation) return alert("GPS needed");
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
                
                isTracking = true;
                btn.classList.add('recording');
                btn.innerHTML = "🛑 STOP DRIVE";
                
                watchId = navigator.geolocation.watchPosition(handlePos, handleErr, { 
                    enableHighAccuracy: true, maximumAge: 500 
                });
            } else {
                // STOP
                isTracking = false;
                navigator.geolocation.clearWatch(watchId);
                if(wakeLock) wakeLock.release();
                btn.classList.remove('recording');
                btn.innerHTML = "📍 START DRIVE";
                document.getElementById('speedVal').innerText = "0";
            }
        }

        function handlePos(pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            // Convert m/s to km/h. Ignore noise below 3km/h
            let speedKmh = (pos.coords.speed || 0) * 3.6;
            if (speedKmh < 3) speedKmh = 0;

            // Update Speedometer
            document.getElementById('speedVal').innerText = speedKmh.toFixed(0);

            // Update Map
            const newLatLng = new L.LatLng(lat, lon);
            if(!map.hasLayer(userMarker)) {
                 userMarker.addTo(map); // Add marker on first lock
                 map.setView(newLatLng, 16); // Zoom in
            }
            userMarker.setLatLng(newLatLng);
            map.panTo(newLatLng); // Keep map centered

            // Calculate Fuel Use
            if (lastLat && speedKmh > 3) {
                 const distKm = getDistKm(lastLat, lastLon, lat, lon);
                 // Sanity check against huge GPS jumps
                 if(distKm > 0.005 && distKm < 1.0) {
                    fuelLiters -= (distKm / EFFICIENCY);
                    updateUI();
                 }
            }
            lastLat = lat; lastLon = lon;
        }

        function handleErr(e) { console.warn("GPS Error", e); }

        // --- MANUAL PANEL TOGGLE ---
        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('active');
        }
        
        // --- MANUAL ACTIONS ---
        function manualRefill() {
            const rm = parseFloat(document.getElementById('manualRM').value);
            const price = parseFloat(document.querySelector('input[name="price"]:checked').value);
            if(rm > 0) {
                fuelLiters += (rm / price);
                document.getElementById('manualRM').value = '';
                toggleSettings(); // Close panel
                updateUI();
            }
        }

        function fullTank() {
            if(confirm("Syncing to FULL TANK (50L). Confirm?")) {
                fuelLiters = TANK_CAPACITY;
                toggleSettings();
                updateUI();
            }
        }

        // Distance Math (Haversine)
        function getDistKm(lat1,lon1,lat2,lon2) {
            var R=6371, dLat=d2r(lat2-lat1), dLon=d2r(lon2-lon1); 
            var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(d2r(lat1))*Math.cos(d2r(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2); 
            return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
        }
        function d2r(d){return d*(Math.PI/180)}

    </script>
</body>
</html>
