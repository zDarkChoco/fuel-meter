<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gen-2 BUDI Dash</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #111111;
            --text-primary: #ffffff;
            --accent: #3498db;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 0;
            height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HUD PANEL --- */
        .hud-panel {
            background: var(--panel-bg);
            padding: 15px;
            border-bottom: 2px solid #333;
            z-index: 50; 
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }

        .hud-top { display: flex; justify-content: space-between; align-items: flex-end; }
        .speed-box { line-height: 0.9; }
        .speed-val { font-size: 4rem; font-weight: 800; letter-spacing: -3px; font-variant-numeric: tabular-nums; }
        .speed-unit { font-size: 0.8rem; color: #777; font-weight: bold; margin-left: 5px; }
        
        .info-box { text-align: right; }
        .info-main { font-size: 1.4rem; font-weight: bold; color: #fff; }
        .info-sub { font-size: 0.9rem; color: #888; margin-top: 2px; }

        .gauge-wrapper {
            background: #222; height: 12px; border-radius: 6px; overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .gauge-bar {
            height: 100%; width: 50%; background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transition: width 0.3s ease, background 0.3s;
        }

        /* --- CONTROLS --- */
        .controls-grid { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 5px; }
        
        .btn-drive {
            grid-column: 1 / -1; 
            background: #222; color: white; border: none; padding: 18px;
            border-radius: 12px; font-weight: bold; font-size: 1.2rem; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-drive.active { background: var(--danger); box-shadow: 0 0 20px rgba(231, 76, 60, 0.4); }

        .btn-refuel {
            grid-column: 1; 
            background: var(--success); color: white; border: none; padding: 15px;
            border-radius: 10px; font-weight: bold; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer;
        }

        .btn-config {
            grid-column: 2; 
            width: 60px; background: #222; border: 1px solid #333; color: #777;
            border-radius: 10px; font-size: 1.5rem; cursor: pointer;
        }

        /* --- MAP --- */
        #map-container { flex-grow: 1; background: #000; position: relative; z-index: 1; }
        #map { width: 100%; height: 100%; }
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        .leaflet-control-container .leaflet-top, .leaflet-control-container .leaflet-bottom { display: none; }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); z-index: 9999;
            backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center;
            animation: fadeIn 0.2s;
        }
        .modal-overlay.open { display: flex; }
        @keyframes fadeIn { from {opacity:0} to {opacity:1} }

        .modal-card {
            background: #1a1a1a; width: 90%; max-width: 350px;
            padding: 25px; border-radius: 20px; border: 1px solid #333;
            text-align: center;
        }
        
        .modal-title { font-size: 1.2rem; margin: 0 0 15px 0; color: #fff; }

        /* Calculation Preview Box */
        .calc-preview {
            background: #2a2a2a; border-radius: 10px; padding: 15px;
            margin-bottom: 20px; border: 1px solid #444;
            text-align: left;
        }
        .preview-lbl { font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .preview-val { font-size: 1.4rem; font-weight: bold; color: var(--accent); }
        .preview-sub { font-size: 0.9rem; color: #888; }

        input.dark-input {
            width: 100%; padding: 15px; background: #000; border: 1px solid #333;
            color: white; border-radius: 10px; font-size: 1.2rem;
            text-align: center; margin-bottom: 15px; box-sizing: border-box;
        }

        .btn-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-opt { flex: 1; padding: 12px; background: #222; border: 1px solid #333; color: #888; border-radius: 8px; cursor: pointer; }
        .btn-opt.selected { background: var(--accent); color: white; border-color: var(--accent); }
        
        .btn-full { width: 100%; padding: 15px; border-radius: 10px; border:none; font-weight:bold; font-size:1rem; cursor: pointer; margin-bottom: 10px;}
        .bg-green { background: var(--success); color: white; }
        .bg-grey { background: #333; color: #ccc; }
        .bg-trans { background: transparent; color: #666; }

    </style>
</head>
<body>

    <div class="hud-panel">
        <div class="hud-top">
            <div class="speed-box">
                <span class="speed-val" id="speedVal">0</span><span class="speed-unit">KM/H</span>
            </div>
            <div class="info-box">
                <div class="info-main" id="dispLiters">-- L</div>
                <div class="info-sub" id="dispRange">-- KM</div>
            </div>
        </div>
        <div class="gauge-wrapper">
            <div class="gauge-bar" id="gaugeBar"></div>
        </div>
        <div class="controls-grid">
            <button class="btn-drive" id="gpsBtn" onclick="toggleDrive()">
                <span id="gpsIcon">📍</span> <span id="gpsText">Start Drive</span>
            </button>
            <button class="btn-refuel" onclick="openModal('refuelModal')">⛽ Add Fuel</button>
            <button class="btn-config" onclick="openModal('configModal')">⚙️</button>
        </div>
    </div>

    <div id="map-container"><div id="map"></div></div>

    <div class="modal-overlay" id="refuelModal">
        <div class="modal-card">
            <h3 class="modal-title">Enter Payment Amount</h3>
            
            <input type="number" id="manualRM" class="dark-input" placeholder="e.g. 50" oninput="updateCalc()">
            
            <div class="btn-row">
                <button class="btn-opt selected" id="btnBudi" onclick="setPrice(1.99, 'btnBudi')">BUDI (1.99)</button>
                <button class="btn-opt" id="btnStd" onclick="setPrice(2.60, 'btnStd')">STD (2.60)</button>
            </div>

            <div class="calc-preview">
                <div class="preview-lbl">⛽ Pump Should Show:</div>
                <div class="preview-val" id="prevRM">RM 0.00</div>
                <div class="preview-sub" id="prevLiters">0.0 Liters</div>
            </div>
            
            <button class="btn-full bg-green" onclick="addFuel()">Confirm Fuel Added</button>
            <button class="btn-full bg-grey" onclick="fullTank()">Set FULL TANK (50L)</button>
            <button class="btn-full bg-trans" onclick="closeModal('refuelModal')">Cancel</button>
        </div>
    </div>

    <div class="modal-overlay" id="configModal">
        <div class="modal-card">
            <h3 class="modal-title">Car Settings</h3>
            <label style="color:#aaa; display:block; margin-bottom:5px;">Tank Size (L)</label>
            <input type="number" id="confTank" class="dark-input" placeholder="50">
            <label style="color:#aaa; display:block; margin-bottom:5px;">Efficiency (KM/L)</label>
            <input type="number" id="confEff" class="dark-input" placeholder="11">
            <button class="btn-full bg-green" onclick="saveConfig()">Save Settings</button>
            <button class="btn-full bg-trans" onclick="closeModal('configModal')">Cancel</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // --- DATA ---
        let state = { fuel: 25, tankMax: 50, eff: 11, price: 1.99 };
        const MARKET_RATE = 2.60; // The actual rate at the pump screen

        let tracking = false;
        let watchId, wakeLock;
        let map, marker;
        let lastLat = null, lastLon = null;

        // --- INIT ---
        window.onload = () => {
            loadState();
            initMap();
            updateUI();
        };

        function loadState() {
            if(localStorage.getItem('g7_fuel')) state.fuel = parseFloat(localStorage.getItem('g7_fuel'));
            if(localStorage.getItem('g7_tank')) state.tankMax = parseFloat(localStorage.getItem('g7_tank'));
            if(localStorage.getItem('g7_eff')) state.eff = parseFloat(localStorage.getItem('g7_eff'));

            document.getElementById('confTank').value = state.tankMax;
            document.getElementById('confEff').value = state.eff;
        }

        function saveData() {
            localStorage.setItem('g7_fuel', state.fuel.toFixed(4));
            localStorage.setItem('g7_tank', state.tankMax);
            localStorage.setItem('g7_eff', state.eff);
        }

        // --- UI UPDATES ---
        function updateUI() {
            if(state.fuel < 0) state.fuel = 0;
            if(state.fuel > state.tankMax) state.fuel = state.tankMax;
            saveData();

            const pct = (state.fuel / state.tankMax) * 100;
            const range = state.fuel * state.eff;

            document.getElementById('dispLiters').innerText = state.fuel.toFixed(1) + " L";
            document.getElementById('dispRange').innerText = "~" + range.toFixed(0) + " KM";
            
            const bar = document.getElementById('gaugeBar');
            bar.style.width = pct + "%";
            if(pct < 15) bar.style.background = "var(--danger)";
            else if(pct < 30) bar.style.background = "var(--warning)";
            else bar.style.background = "var(--accent)";
            bar.style.boxShadow = `0 0 15px ${bar.style.background}`;
        }

        // --- MODALS ---
        function openModal(id) { document.getElementById(id).classList.add('open'); }
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }

        // --- CALCULATOR LOGIC ---
        function setPrice(p, id) {
            state.price = p;
            document.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('selected'));
            document.getElementById(id).classList.add('selected');
            updateCalc(); // Recalculate preview when price toggles
        }

        function updateCalc() {
            const payRM = parseFloat(document.getElementById('manualRM').value) || 0;
            const prevRM = document.getElementById('prevRM');
            const prevLiters = document.getElementById('prevLiters');

            if(payRM > 0) {
                // 1. Calculate how many Liters you GET for your money
                const litersReceived = payRM / state.price;

                // 2. Calculate what the PUMP SCREEN shows (Market Rate)
                const pumpDisplayRM = litersReceived * MARKET_RATE;

                prevRM.innerText = "RM " + pumpDisplayRM.toFixed(2);
                prevLiters.innerText = litersReceived.toFixed(1) + " Liters";
                
                // Visual cue if BUDI is on
                if(state.price < MARKET_RATE) {
                    prevRM.style.color = "var(--success)"; // Green text indicating value
                } else {
                    prevRM.style.color = "var(--accent)"; // Standard blue
                }
            } else {
                prevRM.innerText = "RM 0.00";
                prevLiters.innerText = "0.0 Liters";
            }
        }

        function addFuel() {
            const payRM = parseFloat(document.getElementById('manualRM').value);
            if(payRM > 0) {
                // Add the calculated liters
                state.fuel += (payRM / state.price);
                
                document.getElementById('manualRM').value = "";
                updateCalc(); // Reset preview
                closeModal('refuelModal');
                updateUI();
            }
        }

        function fullTank() {
            if(confirm("Confirm Full Tank?")) {
                state.fuel = state.tankMax;
                closeModal('refuelModal');
                updateUI();
            }
        }

        function saveConfig() {
            const t = parseFloat(document.getElementById('confTank').value);
            const e = parseFloat(document.getElementById('confEff').value);
            if(t > 0 && e > 0) {
                state.tankMax = t; state.eff = e;
                updateUI();
                closeModal('configModal');
            }
        }

        // --- GPS ENGINE ---
        function initMap() {
            map = L.map('map', { zoomControl:false, dragging:false, touchZoom:false, scrollWheelZoom:false }).setView([4.2105, 101.9758], 15);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
            const icon = L.divIcon({ className: 'car', html: '<div style="width:24px;height:24px;background:#3498db;border:4px solid white;border-radius:50%;box-shadow:0 0 15px #3498db;"></div>', iconSize:[32,32], iconAnchor:[16,16] });
            marker = L.marker([0,0], {icon: icon});
        }

        async function toggleDrive() {
            const btn = document.getElementById('gpsBtn');
            const txt = document.getElementById('gpsText');
            
            if(!tracking) {
                // START
                if(!navigator.geolocation) return alert("GPS Required");
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
                
                tracking = true;
                btn.classList.add('active'); txt.innerText = "STOP DRIVE";
                
                watchId = navigator.geolocation.watchPosition(pos => {
                    const { latitude: lat, longitude: lon, speed } = pos.coords;
                    
                    let kmh = (speed || 0) * 3.6;
                    document.getElementById('speedVal').innerText = kmh.toFixed(0);

                    const loc = new L.LatLng(lat, lon);
                    if(!map.hasLayer(marker)) marker.addTo(map);
                    marker.setLatLng(loc);
                    map.setView(loc, 17);

                    if(lastLat && kmh > 3) {
                        const dist = getDist(lastLat, lastLon, lat, lon);
                        if(dist > 0.002 && dist < 0.5) {
                            state.fuel -= (dist / state.eff);
                            updateUI();
                        }
                    }
                    lastLat = lat; lastLon = lon;
                }, err => console.log(err), { enableHighAccuracy: true });

            } else {
                // STOP
                tracking = false;
                navigator.geolocation.clearWatch(watchId);
                if(wakeLock) wakeLock.release();
                btn.classList.remove('active'); txt.innerText = "START DRIVE";
                document.getElementById('speedVal').innerText = "0";
            }
        }

        function getDist(lat1,lon1,lat2,lon2) {
            const R=6371, dLat=d2r(lat2-lat1), dLon=d2r(lon2-lon1); 
            const a=Math.sin(dLat/2)**2 + Math.cos(d2r(lat1))*Math.cos(d2r(lat2))*Math.sin(dLon/2)**2; 
            return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
        }
        const d2r = d => d*(Math.PI/180);

    </script>
</body>
</html>
